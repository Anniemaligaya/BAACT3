<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - EcoCoins</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"></script>
    <style>
      label.error {
        color: #dc3545;
        font-size: 0.85rem;
        margin-top: 0.25rem;
        display: block;
      }
      .form-floating + label.error {
        margin-top: -0.5rem;
        margin-bottom: 0.75rem;
      }
      input.error {
        border-color: #dc3545 !important;
      }
    </style>
  </head>
  <body class="bg-light min-vh-100 d-flex flex-column justify-content-between">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">EcoCoins Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link" href="index.html#hero">Overview</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#details">Project Details</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#steps">Steps</a></li>
            <li class="nav-item ms-lg-3"><a class="btn btn-light text-success btn-sm px-3 fw-semibold" href="login.html">Sign In</a></li>
            <li class="nav-item ms-lg-2"><a class="btn btn-outline-light btn-sm px-3" href="register.html">Register Account</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5 my-auto">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card border-success bg-white shadow-sm">
            <div class="card-body p-4">
              <h4 class="fw-bold text-success mb-1 text-center">User Sign In</h4>
              <p class="text-muted small mb-4 text-center">Access your EcoCoins rewards dashboard</p>

              <div id="loginMsg"></div>

              <form action="#" id="loginForm" method="POST" novalidate>
                <div class="form-floating mb-3">
                  <input type="email" class="form-control border-success" id="loginEmail" name="loginEmail" placeholder="name@example.com">
                  <label for="loginEmail" class="text-secondary">Email address</label>
                </div>

                <div class="form-floating mb-3">
                  <input type="password" class="form-control border-success" id="loginPass" name="loginPass" placeholder="Password">
                  <label for="loginPass" class="text-secondary">Password</label>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input border-success" type="checkbox" id="keepSession" name="keepSession">
                    <label class="form-check-label text-secondary small" for="keepSession">Keep me logged in</label>
                  </div>
                  <a href="#" class="text-success small text-decoration-none">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Sign In</button>
              </form>
            </div>
            <div class="card-footer bg-light border-top border-success text-center py-3">
              <span class="text-secondary small">Need an account? </span>
              <a href="register.html" class="text-success fw-bold text-decoration-none">Register here</a>
            </div>
          </div>
          <div class="text-center mt-3">
            <a href="index.html" class="text-secondary small text-decoration-none">&larr; Return to main page</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-white border-top border-success text-center py-3">
      <div class="container">
        <p class="text-muted small mb-0">&copy; EcoCoins System Proposal - Lipa City Malls.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      $(document).ready(function () {
        $("#loginForm").validate({
          rules: {
            loginEmail: {
              required: true,
              email: true
            },
            loginPass: {
              required: true
            }
          },
          messages: {
            loginEmail: {
              required: "Please enter your email",
              email: "Invalid email format"
            },
            loginPass: {
              required: "Please enter your password"
            }
          },
          errorPlacement: function (error, element) {
            if (element.closest(".form-floating").length) {
              error.insertAfter(element.closest(".form-floating"));
            } else {
              error.insertAfter(element);
            }
          },
          submitHandler: function (form) {
            var email = $("#loginEmail").val().toLowerCase();
            var password = $("#loginPass").val();
            var feedback = $("#loginMsg");

            var defaultAcc = {
              email: "student@ecocoins.ph",
              pass: "ecopass123",
              name: "Student User"
            };

            var records = JSON.parse(localStorage.getItem("portalUsers") || "[]");
            var found = null;

            if (email === defaultAcc.email && password === defaultAcc.pass) {
              found = { name: defaultAcc.name, email: defaultAcc.email };
            } else {
              for (var i = 0; i < records.length; i++) {
                if (records[i].email === email && records[i].password === password) {
                  found = { name: records[i].fullName, email: records[i].email };
                  break;
                }
              }
            }

            if (found) {
              localStorage.setItem("portalCurrent", JSON.stringify(found));
              feedback.html('<div class="alert alert-success py-2 small">Sign in successful! Redirecting...</div>');
              setTimeout(function () {
                window.location.href = "index.html";
              }, 1000);
            } else {
              feedback.html('<div class="alert alert-danger py-2 small">Incorrect email or password.</div>');
            }

            return false;
          }
        });
      });
    </script>
  </body>
</html>
