<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - EcoCoins</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"></script>
    <style>
      label.error {
        color: #dc3545;
        font-size: 0.825rem;
        margin-top: 0.35rem;
        margin-bottom: 0.5rem;
        display: block;
      }
      input.error {
        border-color: #dc3545 !important;
      }
    </style>
  </head>
  <body class="bg-light min-vh-100 d-flex flex-column justify-content-between">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">EcoCoins Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link" href="index.html#hero">Overview</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#details">Project Details</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#steps">Steps</a></li>
            <li class="nav-item ms-lg-3"><a class="btn btn-outline-light btn-sm px-3" href="login.html">Sign In</a></li>
            <li class="nav-item ms-lg-2"><a class="btn btn-light text-success btn-sm px-3 fw-semibold" href="register.html">Register Account</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5 my-auto">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <div class="card border-success bg-white shadow-sm">
            <div class="card-body p-4">
              <h4 class="fw-bold text-success mb-1 text-center">Account Registration</h4>
              <p class="text-muted small mb-4 text-center">Join the Lipa City EcoCoins recycling program</p>

              <div id="msg"></div>

              <form action="#" id="regForm" method="POST" novalidate>
                <div class="mb-3">
                  <div class="form-floating">
                    <input type="text" class="form-control border-success" id="accountName" name="accountName" placeholder="Full Name">
                    <label for="accountName" class="text-secondary">Full Name</label>
                  </div>
                </div>

                <div class="mb-3">
                  <div class="form-floating">
                    <input type="email" class="form-control border-success" id="accountEmail" name="accountEmail" placeholder="name@example.com">
                    <label for="accountEmail" class="text-secondary">Email address</label>
                  </div>
                </div>

                <div class="row g-2 mb-3">
                  <div class="col-md-6 mb-2 mb-md-0">
                    <div class="form-floating">
                      <input type="password" class="form-control border-success" id="createPass" name="createPass" placeholder="Password">
                      <label for="createPass" class="text-secondary">Password</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-floating">
                      <input type="password" class="form-control border-success" id="verifyPass" name="verifyPass" placeholder="Confirm Password">
                      <label for="verifyPass" class="text-secondary">Confirm Password</label>
                    </div>
                  </div>
                </div>

                <div class="form-check mb-4">
                  <input class="form-check-input border-success" type="checkbox" id="acceptPolicy" name="acceptPolicy">
                  <label class="form-check-label text-secondary small" for="acceptPolicy">
                    I agree to the proper disposal and recycling policies of partner malls.
                  </label>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Create Account</button>
              </form>
            </div>
            <div class="card-footer bg-light border-top border-success text-center py-3">
              <span class="text-secondary small">Already registered? </span>
              <a href="login.html" class="text-success fw-bold text-decoration-none">Sign in here</a>
            </div>
          </div>
          <div class="text-center mt-3">
            <a href="index.html" class="text-secondary small text-decoration-none">&larr; Return to main page</a>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-white border-top border-success text-center py-3">
      <div class="container">
        <p class="text-muted small mb-0">&copy; EcoCoins System Proposal - Lipa City Malls.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      $(document).ready(function () {
        $("#regForm").validate({
          rules: {
            accountName: {
              required: true,
              minlength: 3
            },
            accountEmail: {
              required: true,
              email: true
            },
            createPass: {
              required: true,
              minlength: 6
            },
            verifyPass: {
              required: true,
              equalTo: "#createPass"
            },
            acceptPolicy: {
              required: true
            }
          },
          messages: {
            accountName: {
              required: "Please enter your full name",
              minlength: "Name must be at least 3 characters"
            },
            accountEmail: {
              required: "Please enter your email address",
              email: "Please provide a valid email"
            },
            createPass: {
              required: "Password is required",
              minlength: "Password should be 6 characters or longer"
            },
            verifyPass: {
              required: "Please confirm your password",
              equalTo: "Passwords do not match"
            },
            acceptPolicy: {
              required: "You must accept the policy"
            }
          },
          errorPlacement: function (error, element) {
            if (element.attr("type") === "checkbox") {
              error.insertAfter(element.closest(".form-check"));
            } else if (element.closest(".form-floating").length) {
              error.insertAfter(element.closest(".form-floating"));
            } else {
              error.insertAfter(element);
            }
          },
          submitHandler: function (form) {
            var name = $("#accountName").val();
            var email = $("#accountEmail").val().toLowerCase();
            var password = $("#createPass").val();

            var list = JSON.parse(localStorage.getItem("portalUsers") || "[]");

            var exists = false;
            for (var i = 0; i < list.length; i++) {
              if (list[i].email === email) {
                exists = true;
                break;
              }
            }

            if (email === "student@ecocoins.ph" || exists) {
              $("#msg").html('<div class="alert alert-warning py-2 small">This email is already registered.</div>');
              return false;
            }

            list.push({
              fullName: name,
              email: email,
              password: password
            });

            localStorage.setItem("portalUsers", JSON.stringify(list));

            $("#msg").html('<div class="alert alert-success py-2 small">Registration successful! Redirecting to sign in...</div>');
            form.reset();

            setTimeout(function () {
              window.location.href = "login.html";
            }, 1200);

            return false;
          }
        });
      });
    </script>
  </body>
</html>
